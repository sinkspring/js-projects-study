<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice - Expanding Cards copy</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <div class="composition">
      <div
        class="slide active"
        style="background-image: url(images/image1.avif)"
      >
        <h3>Explore The World</h3>
      </div>
      <div class="slide" style="background-image: url(images/image2.avif)">
        <h3>Wild Forest</h3>
      </div>
      <div class="slide" style="background-image: url(images/image3.avif)">
        <h3>Sunny Beach</h3>
      </div>
      <div class="slide" style="background-image: url(images/image4.avif)">
        <h3>City on Winter</h3>
      </div>
      <div class="slide" style="background-image: url(images/image5.avif)">
        <h3>Mountains - Clouds</h3>
      </div>
    </div>
  </body>
</html>
